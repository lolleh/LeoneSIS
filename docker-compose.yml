name: schoolms

services:
  db:
    image: postgres:16-alpine
    container_name: schoolms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolms}
      POSTGRES_USER: ${POSTGRES_USER:-schoolms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolms}
    volumes:
      - schoolms-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - schoolms

  app:
    build:
      context: ./backend
    container_name: schoolms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-schoolms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-schoolms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-schoolms}
      APP_UPLOAD_DIR: /data/uploads
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      SERVER_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseContainerSupport}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - schoolms-uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - schoolms

volumes:
  schoolms-db:
    name: schoolms-db
  schoolms-uploads:
    name: schoolms-uploads

networks:
  schoolms:
    name: schoolms-network
